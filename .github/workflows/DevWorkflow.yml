name: Tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 8 * * *'

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set Python environment
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test/requirements_test.txt

      - name: Lint with ruff
        run: ruff check

      - name: Check formatting with ruff
        run: ruff format --check --diff

  unittest:
    needs: linting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 4
      matrix:
        container: ['qgis/qgis:latest', 'qgis/qgis:ltr']
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python3 -m venv /tmp/.venv --system-site-packages
          . /tmp/.venv/bin/activate
          qgis --version
          python3 -m pip install -U pip setuptools uv
          python3 -m uv pip install -r test/requirements_test.txt
          export PYTHONPATH=$(pwd)/getthemfiltered:$PYTHONPATH
          echo "PYTHONPATH=$PYTHONPATH" >> $GITHUB_ENV

      - name: Run tests
        run: |
          . /tmp/.venv/bin/activate
          export QT_QPA_PLATFORM=offscreen
          pwd
          python3 -m pytest --cov-report term-missing --cov=getthemfiltered test

  windows_test:
    needs: linting
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        version: [qgis, qgis-ltr --version=3.40.8]

    steps:
      - uses: actions/checkout@v7

      - name: Determine QGIS cache version
        id: qgis-version
        shell: pwsh
        run: |
          if ("${{ matrix.version }}" -eq "qgis") {
            $v = (choco info qgis --limit-output | Select-Object -First 1).Split('|')[1]
          } else {
            $v = "3.40.8"
          }
          "qgis_version=$v" >> $env:GITHUB_OUTPUT

      - name: Cache QGIS installation
        id: cache-qgis
        uses: actions/cache@v6
        with:
          path: C:\Program Files\QGIS*
          key: ${{ runner.os }}-qgis-${{ steps.qgis-version.outputs.qgis_version }}

      - name: Install QGIS on Chocolatey
        if: steps.cache-qgis.outputs.cache-hit != 'true'
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install ${{ matrix.version }} -y

      - name: Setup and test plugin on Latest
        shell: pwsh
        if: ${{ (matrix.version == 'qgis')}}
        run: |
          $qgisPath = (Get-ChildItem -Path "C:\Program Files" -Filter "QGIS*" -Directory).FullName
          $qgisExec = "$qgisPath\bin\python-qgis.bat"
          $pluginPath = "$env:APPDATA\QGIS\QGIS4\profiles\default\python\plugins"
          $gtfPath = "$pluginPath\getthemfiltered"
          Copy-Item "getthemfiltered" -Destination "$gtfPath" -Recurse
          Copy-Item "test" -Destination "$pluginPath\test" -Recurse
          $env:PYTHONPATH = "$qgisPath\apps\qgis\python;$pluginPath;$gtfPath"
          $env:QT_QPA_PLATFORM = "offscreen"
          $pip = Start-Process -FilePath "$qgisExec" -ArgumentList "-m pip install -r $pluginPath\test\requirements_test.txt" -NoNewWindow -Wait -PassThru
          if ($pip.ExitCode -ne 0) { throw "Installing the test requirements failed (exit $($pip.ExitCode)); pytest cannot run without pytest-reportlog" }
          Set-Location "$pluginPath"
          $tests = Start-Process -FilePath "$qgisExec" -ArgumentList "-m pytest test --report-log=$pluginPath\log.jsonl" -NoNewWindow -Wait -PassThru
          Write-Host "pytest exited with $($tests.ExitCode)"

      - name: Setup and test plugin on LTR
        shell: pwsh
        if: ${{ (matrix.version != 'qgis')}}
        run: |
          $qgisPath = (Get-ChildItem -Path "C:\Program Files" -Filter "QGIS*" -Directory).FullName
          $qgisExec = "$qgisPath\bin\python-qgis-ltr.bat"
          $pluginPath = "$env:APPDATA\QGIS\QGIS3\profiles\default\python\plugins"
          $gtfPath = "$pluginPath\getthemfiltered"
          Copy-Item "getthemfiltered" -Destination "$gtfPath" -Recurse
          Copy-Item "test" -Destination "$pluginPath\test" -Recurse
          $env:PYTHONPATH = "$qgisPath\apps\qgis\python;$pluginPath;$gtfPath"
          $env:QT_QPA_PLATFORM = "offscreen"
          $pip = Start-Process -FilePath "$qgisExec" -ArgumentList "-m pip install -r $pluginPath\test\requirements_test.txt" -NoNewWindow -Wait -PassThru
          if ($pip.ExitCode -ne 0) { throw "Installing the test requirements failed (exit $($pip.ExitCode)); pytest cannot run without pytest-reportlog" }
          Set-Location "$pluginPath"
          $tests = Start-Process -FilePath "$qgisExec" -ArgumentList "-m pytest test --report-log=$pluginPath\log.jsonl" -NoNewWindow -Wait -PassThru
          Write-Host "pytest exited with $($tests.ExitCode)"

      - name: Check if tests failed
        shell: pwsh
        run: |
          $log = Get-ChildItem -Path "$env:APPDATA\QGIS\QGIS*\profiles\default\python\plugins\log.jsonl" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $log) {
              Write-Error "No test report was produced - the test run did not complete"
              exit 1
          }
          $fails = Select-String -Path $log.FullName -Pattern 'failed'
          if ($fails.Matches.Length -gt 0) {
              Write-Error "Check for errors in the tests run"
              exit 1
          }
